  <!-- Scripts for Navbar Scroll and Collapsible Left Drawer -->
  <script>
    // Header translucent frosted glass on scroll
    const header = document.getElementById('siteHeader');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 20) {
        header.classList.add('bg-white/60', 'border-b', 'border-[#BC042D]/15', 'backdrop-blur-md', 'py-3.5', 'shadow-sm');
        header.classList.remove('bg-transparent', 'py-5');
      } else {
        header.classList.remove('bg-white/60', 'border-b', 'border-[#BC042D]/15', 'backdrop-blur-md', 'py-3.5', 'shadow-sm');
        header.classList.add('bg-transparent', 'py-5');
      }
    });

    // Collapsible Left Drawer Menu Handlers
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');
    const leftDrawer = document.getElementById('leftDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const drawerLinks = document.querySelectorAll('.drawer-link');

    function openDrawer() {
      leftDrawer.classList.remove('-translate-x-full');
      leftDrawer.classList.add('translate-x-0');
      drawerBackdrop.classList.remove('opacity-0', 'pointer-events-none');
      drawerBackdrop.classList.add('opacity-100', 'pointer-events-auto');
      document.body.classList.add('overflow-hidden');
    }

    function closeDrawer() {
      leftDrawer.classList.add('-translate-x-full');
      leftDrawer.classList.remove('translate-x-0');
      drawerBackdrop.classList.add('opacity-0', 'pointer-events-none');
      drawerBackdrop.classList.remove('opacity-100', 'pointer-events-auto');
      document.body.classList.remove('overflow-hidden');
    }

    if (menuToggleBtn) menuToggleBtn.addEventListener('click', openDrawer);
    if (drawerCloseBtn) drawerCloseBtn.addEventListener('click', closeDrawer);
    if (drawerBackdrop) drawerBackdrop.addEventListener('click', closeDrawer);
    drawerLinks.forEach(link => {
      link.addEventListener('click', closeDrawer);
    });
  </script>
