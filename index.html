<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARSHANA — Luxury Heritage & Couture</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#380712',
              light: '#5a1122',
            },
            gold: {
              DEFAULT: '#c59d3f',
              light: '#fae29c',
            }
          },
          fontFamily: {
            serif: ['Cinzel', 'Georgia', 'serif'],
            cormorant: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>

<body class="w-full min-h-screen font-sans bg-white text-gray-900 antialiased overflow-x-hidden scroll-smooth">

  <!-- Fixed Transparent Navbar -->
  <header id="siteHeader"
    class="fixed top-0 left-0 right-0 z-50 bg-transparent py-5 px-6 sm:px-10 transition-all duration-300">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <span
        class="font-serif text-2xl sm:text-3xl font-bold tracking-[0.15em] text-gold-light transition-opacity hover:opacity-85">LOGO</span>
      <nav class="flex items-center gap-5 sm:gap-8" aria-label="Main Navigation">
        <a href="#"
          class="text-white hover:text-gold-light font-sans font-medium text-sm sm:text-base tracking-wide transition-colors">Home</a>
        <a href="#collection"
          class="text-white hover:text-gold-light font-sans font-medium text-sm sm:text-base tracking-wide transition-colors">Collection</a>
        <a href="#about"
          class="text-white hover:text-gold-light font-sans font-medium text-sm sm:text-base tracking-wide transition-colors">About</a>
        <a href="#contact"
          class="text-white hover:text-gold-light font-sans font-medium text-sm sm:text-base tracking-wide transition-colors">Contact</a>
      </nav>
    </div>
  </header>

  <!-- 1st Page: Fullscreen Hero Background with Fitted Royal Typography -->
  <main class="relative w-full h-screen min-h-[620px] overflow-hidden flex items-center justify-end bg-stone-900">
    <!-- Fullscreen Hero Background Image -->
    <img src="images/hero.png" alt="DARSHANA Heritage Sarees"
      class="absolute inset-0 w-full h-full object-cover object-center pointer-events-none select-none" />



    <!-- Footer Section -->
    <footer id="contact" class="bg-[#1a0810] text-[#ebdcd0] py-12 px-6 sm:px-12 text-center">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
        <span class="font-serif text-2xl font-bold tracking-[0.15em] text-[#fae29c]">DARSHANA</span>
        <p class="text-xs text-[#ebdcd0]/70">
          © 2026 DARSHANA Couture. All rights reserved. Handcrafted with royal legacy.
        </p>
        <div class="flex items-center gap-6 text-xs uppercase tracking-wider text-[#ebdcd0]/80">
          <a href="#" class="hover:text-[#fae29c] transition-colors">Privacy</a>
          <a href="#" class="hover:text-[#fae29c] transition-colors">Terms</a>
          <a href="#" class="hover:text-[#fae29c] transition-colors">Contact</a>
        </div>
      </div>
    </footer>

    <!-- Scroll Effect Script -->
    <script>
      const header = document.getElementById('siteHeader');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          header.classList.add('bg-[#12060b]/85', 'backdrop-blur-md', 'py-3.5', 'shadow-lg');
          header.classList.remove('bg-transparent', 'py-5');
        } else {
          header.classList.remove('bg-[#12060b]/85', 'backdrop-blur-md', 'py-3.5', 'shadow-lg');
          header.classList.add('bg-transparent', 'py-5');
        }
      });
    </script>
</body>

</html>
